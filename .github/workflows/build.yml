name: Build and publish Ora

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'AGENTS.md', 'README.md', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'AGENTS.md', 'README.md', '**/*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coursly-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Resolve Ora version
        id: version
        run: |
          set -euo pipefail
          BASE_VERSION=$(awk '/MARKETING_VERSION:/ { gsub(/"/, "", $2); print $2; exit }' project.yml)
          SERIES=$(echo "$BASE_VERSION" | awk -F. '{ print $1 "." $2 }')
          LAST_BUILD=$(git tag -l "v${SERIES}.*" | sed -E "s/^v${SERIES//./\\.}\.([0-9]+)$/\\1/" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$LAST_BUILD" ]; then BUILD=1; else BUILD=$((LAST_BUILD + 1)); fi
          VERSION="${SERIES}.${BUILD}"
          TAG="v${VERSION}"
          echo "series=$SERIES" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Ora version: $VERSION"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run V3 unit tests
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          for runtime_devices in payload.get("devices", {}).values():
              for device in runtime_devices:
                  if device.get("isAvailable") and str(device.get("name", "")).startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          ')
          if [ -z "$SIMULATOR_ID" ]; then echo "Aucun simulateur iPhone disponible sur le runner macOS."; exit 1; fi
          xcodebuild test -project Ora.xcodeproj -scheme Ora -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build-tests CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Build iPhone app without code signing
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          xcodebuild -project Ora.xcodeproj -scheme Ora -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO clean build

      - name: Package IPA
        run: |
          rm -rf Payload Ora.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Ora.app Payload/Ora.app
          zip -qry Ora.ipa Payload

      - name: Read build metadata
        id: meta
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          APP='build/Build/Products/Release-iphoneos/Ora.app'
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          SIZE=$(stat -f%z Ora.ipa)
          SHA256=$(shasum -a 256 Ora.ipa | awk '{print $1}')
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.meta.outputs.tag }}" Ora.ipa --repo "$GITHUB_REPOSITORY" --title "Ora ${{ steps.meta.outputs.version }}" --notes "Build de développement destinée à être signée sur l’appareil." --prerelease

      - name: Update site metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
          SIZE: ${{ steps.meta.outputs.size }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          DATE: ${{ steps.meta.outputs.date }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git fetch origin site
          git worktree add public origin/site
          DOWNLOAD="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Ora.ipa"
          python3 - "$VERSION" "$BUILD" "$SIZE" "$SHA256" "$DATE" "$DOWNLOAD" <<'PY'
          import json, pathlib, re, sys
          version, build, size, sha256, date, download = sys.argv[1:]
          source_path = pathlib.Path('public/source.json')
          source = json.loads(source_path.read_text(encoding='utf-8'))
          app = source['apps'][0]
          app['name'] = 'Ora'
          versions = [v for v in app.get('versions', []) if re.search(r'/releases/download/v0\.\d+\.\d+/', str(v.get('downloadURL', '')))]
          versions = [v for v in versions if v.get('version') != version]
          versions.insert(0, {'version': version, 'buildVersion': build, 'date': date, 'localizedDescription': f'Ora {version}', 'downloadURL': download, 'size': int(size), 'sha256': sha256, 'minOSVersion': '26.0'})
          app['versions'] = versions[:20]
          app['version'] = version; app['buildVersion'] = build; app['versionDate'] = date; app['downloadURL'] = download; app['size'] = int(size); app['sha256'] = sha256
          app.pop('marketingVersion', None); app.setdefault('appPermissions', {})
          source_path.write_text(json.dumps(source, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          latest = {'name': 'Ora', 'bundleIdentifier': 'fr.bastiannoel.coursly', 'version': version, 'buildVersion': build, 'date': date, 'downloadURL': download, 'size': int(size), 'sha256': sha256}
          pathlib.Path('public/latest.json').write_text(json.dumps(latest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          cd public
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source.json latest.json
          git commit -m "Publish Ora $VERSION"
          git push origin HEAD:site

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ora-${{ steps.meta.outputs.version }}
          path: Ora.ipa
          retention-days: 14
