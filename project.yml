name: Ora
options:
  bundleIdPrefix: fr.bastiannoel
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_LANGUAGE: fr
targets:
  Ora:
    type: application
    platform: iOS
    sources:
      - path: Coursly
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.bastiannoel.coursly
        PRODUCT_NAME: Ora
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ora
        INFOPLIST_KEY_CFBundleDevelopmentRegion: fr
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Manual
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
    dependencies:
      - target: OraLiveActivity
  OraLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: CourslyLiveActivity
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.bastiannoel.coursly.liveactivity
        PRODUCT_NAME: OraLiveActivity
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CourslyLiveActivity/Info.plist
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 1
        SKIP_INSTALL: YES
  OraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CourslyTests
    dependencies:
      - target: Ora
schemes:
  Ora:
    build:
      targets:
        Ora: all
        OraTests: [test]
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: OraTests
