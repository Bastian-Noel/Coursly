name: Coursly
options:
  bundleIdPrefix: fr.bastiannoel
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Coursly:
    type: application
    platform: iOS
    sources:
      - path: Coursly
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.bastiannoel.coursly
        PRODUCT_NAME: Coursly
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Coursly
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Manual
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
    dependencies:
      - target: CourslyLiveActivity
    scheme:
      testTargets: []
      gatherCoverageData: true
  CourslyLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: CourslyLiveActivity
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.bastiannoel.coursly.liveactivity
        PRODUCT_NAME: CourslyLiveActivity
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Coursly
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SKIP_INSTALL: YES
  CourslyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CourslyTests
    dependencies:
      - target: Coursly
schemes:
  Coursly:
    build:
      targets:
        Coursly: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - CourslyTests
