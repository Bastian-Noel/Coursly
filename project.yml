name: Coursly
options:
  bundleIdPrefix: fr.bastiannoel
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Coursly:
    type: application
    platform: iOS
    sources:
      - path: Coursly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.bastiannoel.coursly
        PRODUCT_NAME: Coursly
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Coursly
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Manual
    scheme:
      testTargets: []
      gatherCoverageData: false
schemes:
  Coursly:
    build:
      targets:
        Coursly: all
    run:
      config: Debug
    archive:
      config: Release
